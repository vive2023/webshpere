---
- name: "Pre-requisites"
  import_tasks: prereq.yml
  become: true
  become_user: root

- name: "Install Java-1.8"
  import_tasks: javainstall.yml
  become: true
  become_user: root

- name: Ensure install directory exists
  ansible.builtin.file:
    path: '{{ install_dir }}'
    state: directory
    owner: wlpadmin
    group: enduser
    mode: '0755'
  become_user: root

- name: Download Liberty package
  ansible.builtin.get_url:
    url: '{{ liberty_url }}'
    dest: '{{ liberty_zip }}'

- name: Unzip Liberty package
  ansible.builtin.unarchive:
    src: '{{ liberty_zip }}'
    dest: '{{ install_dir }}'
    remote_src: true

- name: Create Liberty Member
  ansible.builtin.command: ./server create {{ server_name }}
  args:
    chdir: '{{ install_dir }}/wlp/bin'

- name: Start Liberty Member
  ansible.builtin.shell: ssh wlpadmin@"{{ member_ip }}" "/opt/ibm/wlp/bin/server start {{ server_name }};"
  delegate_to: localhost

- name: Join collective
  ansible.builtin.shell: ssh wlpadmin@{{ member_ip }} "/opt/ibm/wlp/bin/collective join {{ server_name }} --host={{ controller_ip }} --port={{ controller_port }} --user={{ controller_user }} --password={{ controller_password }} --keystorePassword={{ keystore_password }} --autoAcceptCertificates --createConfigFile;"
  delegate_to: localhost
  ignore_errors: yes

- name: Create the jvm.options file
  ansible.builtin.file:
    path: "/opt/ibm/wlp/usr/servers/{{ server_name }}/jvm.options"
    state: touch
    mode: '0755'

- name: Set JAVA_HOME in server.env (8)
  ansible.builtin.lineinfile:
    path: "/opt/ibm/wlp/usr/servers/{{ server_name }}/server.env"
    line: "JAVA_HOME=/etc/alternatives/jre_1.8.0"
    insertafter: EOF
    create: yes
  when: jdk_version in [8]

- name: Configure logging for the server
  include_tasks: logging.yml

- name: Update the server.xml
  import_tasks: "server_xml.yml"

- name: Install clusterMember feature
  ansible.builtin.command: ./featureUtility installFeature clusterMember-1.0 --acceptLicense
  args:
    chdir: '{{ install_dir }}/wlp/bin'

- name: Install jaxws-2.2 feature
  ansible.builtin.command: "./installUtility install jaxws-2.2"
  args:
    chdir: "{{ install_dir }}/wlp/bin"

- name: Add clusterMember feature to include XML
  ansible.builtin.blockinfile:
    path: '{{ include_xml_path }}'
    marker: '# {mark} ANSIBLE MANAGED BLOCK - CLUSTER'
    block: |
      <featureManager>
          <feature>clusterMember-1.0</feature>
      </featureManager>
      <clusterMember name="wlpCluster"/>

- name: Remove all </server> tags from server.xml
  ansible.builtin.replace:
    path: '{{ server_xml_path }}'
    regexp: </server>
    replace: ''

- name: Remove all </server> tags from collective-join-include.xml
  ansible.builtin.replace:
    path: '{{ include_xml_path }}'
    regexp: </server>
    replace: ''

- name: Include collective-join-include.xml in server.xml
  ansible.builtin.blockinfile:
    path: '{{ server_xml_path }}'
    marker: ""
    block: '{{ include_line }}'

- name: Ensure wasadmin owns install directory and perms are 755
  ansible.builtin.file:
    path: '{{ install_dir }}'
    owner: wlpadmin
    group: enduser
    mode: '0755'
    recurse: true

- name: Ensure </server> is at the end of server.xml
  ansible.builtin.lineinfile:
    path: '{{ server_xml_path }}'
    line: </server>
    state: present
    insertafter: EOF

- name: Ensure </server> is at the end of collective-join-include.xml
  ansible.builtin.lineinfile:
    path: '{{ include_xml_path }}'
    line: </server>
    state: present
    insertafter: EOF

- name: Ensure keystore directory exists
  ansible.builtin.file:
    path: '{{ keystore_dir }}'
    state: directory
    owner: wlpadmin
    group: enduser
    mode: '0755'
  become_user: root

- name: Ensure websphere directory exists
  ansible.builtin.file:
    path: '{{ websphere_dir }}'
    state: directory
    owner: wlpadmin
    group: enduser
    mode: '0755'
  become_user: root

- name: Copy file from AWD.WAR to member
  ansible.builtin.shell: |
    scp -i /home/wlpadmin/.ssh/id_rsa \
        {{ hostvars[chorus_host].ansible_user }}@{{ hostvars[chorus_host].ansible_host }}:{{ remote_awd_file }} {{ local_awd_file }}
  args:
    executable: /bin/bash

- name: Copy file from Keystore to member
  ansible.builtin.shell: |
    scp -i /home/wlpadmin/.ssh/id_rsa \
        {{ hostvars[chorus_host].ansible_user }}@{{ hostvars[chorus_host].ansible_host }}:{{ remote_awdkey_file }} {{ local_awdkey_file }}
  args:
    executable: /bin/bash
  ignore_errors: yes

- name: Download RetrieveObjectWrapper.war file
  ansible.builtin.get_url:
    url: "{{ retrive_war_location }}"
    dest: "{{ local_awd_apps }}"
    mode: '0755'

- name: Adding the missing features in server.xml
  ansible.builtin.blockinfile:
    path: "{{ server_xml_path }}"
    marker: ""
    insertbefore: '</server>'
    block: "{{ reqired_features }}"

- name: Adding the missing features in server.xml
  ansible.builtin.blockinfile:
    path: "{{ jvm_options_path }}"
    insertbefore: '</server>'
    block: "{{ jvm_options_variable }}"

- name: Delete Webprofile-8.0 block from server.xml
  ansible.builtin.xml:
    path: "{{ server_xml_path }}"
    xpath: /server/featureManager[feature="webProfile-8.0"]
    state: absent

- name: Removing httpd existing entry
  ansible.builtin.xml:
    path: "{{ server_xml_path }}"
    xpath: /server/httpEndpoint[@id="defaultHttpEndpoint"]
    #attribute: host
    #value: "*"
    state: absent

- name: Adding the missing features in server.xml
  ansible.builtin.blockinfile:
    path: "{{ server_xml_path }}"
    insertbefore: '</server>'
    block: "{{ httpd_endpoint }}"
    marker: ""

- name: Add Jassmodule feature to serverXML
  ansible.builtin.blockinfile:
    path: "{{ server_xml_path }}"
    insertbefore: '</server>'
    marker: ""
    block: "{{ jassmodule_block }}"

- name: Add quicksecurity,executor,remotefile feature to serverXML
  ansible.builtin.blockinfile:
    path: "{{ server_xml_path }}"
    insertbefore: '</server>'
    marker: ""
    block: "{{ quicksec_executor_remotefile }}"

- name: Copy file from AWD.WAR to Apps of member
  ansible.builtin.shell: |
    scp -i /home/wlpadmin/.ssh/id_rsa \
        {{ hostvars[chorus_host].ansible_user }}@{{ hostvars[chorus_host].ansible_host }}:{{ remote_awd_file }} {{ local_awd_apps}}
  args:
    executable: /bin/bash

- name: Ensure /opt/ibm/wlp/usr/servers/<server-name>/lib  directory exists
  ansible.builtin.file:
    path: "{{ install_dir1 }}"
    state: directory
    mode: '0755'
    owner: wlpadmin
    group: enduser
  become_user: root
  become: yes

- name: Download JDBC.Jar file
  ansible.builtin.get_url:
    url: "{{ jdbc_location }}"
    dest: "{{ install_dir1 }}"
    mode: '0755'

- name: Enable New Relic
  import_tasks: newrelic_hook.yml
  become_user: root
  become: true

### Splunk forwarder
- name: Add splunk config
  import_tasks: "splunk_forwarder.yml"
  become_user: root
  become: true

### Cron jobs to purge log files
- name: Setup cronjobs to purge log files
  import_tasks: "cronjobs.yml"
  become_user: root
  become: true

- name: Create the configDropins/overrides directory
  ansible.builtin.file:
    path: "/opt/ibm/wlp/usr/servers/{{ server_name }}/configDropins/overrides"
    state: directory
    mode: '0755'

- name: Copy NW_security_defaults.xml
  copy:
    src: files/NW_security_defaults.xml
    dest: /opt/ibm/wlp/usr/servers/{{ server_name }}/configDropins/overrides/NW_security_defaults.xml
  ignore_errors: yes

- name: Copy liberty.service
  copy:
    src: files/liberty.service
    dest: /etc/systemd/system/liberty_{{ server_name }}.service
  become_user: root

- name: Update the server_name in the service
  replace:
    path: /etc/systemd/system/liberty_{{ server_name }}.service
    regexp: 'SERVERNAME'
    replace: '{{ server_name }}'
  become_user: root

- name: Update the userid in the service
  replace:
    path: /etc/systemd/system/liberty_{{ server_name }}.service
    regexp: 'USERID'
    replace: '{{ userid }}'
  become_user: root

- name: Update the groupid in the service
  replace:
    path: /etc/systemd/system/liberty_{{ server_name }}.service
    regexp: 'GROUPID'
    replace: '{{ groupid }}'
  become_user: root

- name: Add DB user,pass details to server.xml
  ansible.builtin.blockinfile:
    path: "{{ server_xml_path }}"
    marker: ""
    block: "{{ db_jdbc_block }}"
    insertbefore: '^</server>'

- name: Download and place DCD file
  ansible.builtin.get_url:
    url: "{{ dcd_file_git }}"
    dest: "{{ dcd_resources_dir }}"
    mode: '0755'

- name: Download and place SSO1 file
  ansible.builtin.get_url:
    url: "{{ sso1_file_git }}"
    dest: "{{ dcd_resources_dir }}"
    mode: '0755'

- name: Download and place SSO2 file
  ansible.builtin.get_url:
    url: "{{ sso2_file_git }}"
    dest: "{{ dcd_resources_dir }}"
    mode: '0755'

- name: awdserver restart 1 final
  ansible.builtin.shell: ssh wlpadmin@"{{ member_ip }}" "/opt/ibm/wlp/bin/server stop {{ server_name }};"
  delegate_to: localhost
  ignore_errors: yes
  tags: [member_stop_now]

- name: awdserver restart 2 final
  ansible.builtin.shell: ssh wlpadmin@"{{ member_ip }}" "/opt/ibm/wlp/bin/server start {{ server_name }};"
  delegate_to: localhost
  ignore_errors: yes
  tags: [member_start_now]
