---
# vars file for apache-tomcat
phrase: "changeit"
httpd_path: "/opt/ibm/IHS/conf/httpd.conf"
httpd_lines: |
  # Identify AWD-specific traffic and format AWD log files.
  Header set awd-content "%D"
  LogFormat "%D \t %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" awd
  CustomLog logs/awdaccess_log awd

  RewriteEngine On
  RewriteCond %{REQUEST_METHOD} GET
  RewriteRule ^/ImageRetrieval(.*)$ http://ImageRetrievalHost/ImageRetrieval$1 [P]

