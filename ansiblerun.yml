- name: Capturing alias_ name
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  tasks:
    - name: Create plugin key database and stash file
      ansible.builtin.shell: |
        keytool -list -keystore /tmp/trust.p12 -storetype PKCS12 -storepass changeit -file liberty_key.crt -rfc|grep -i alias|awk '{print $3}'
      register: alias_names
      changed_when: false
    - name: Set alias list variable
      set_fact:
        alias_list: "{{ alias_names.stdout_lines }}"
    - name: Print aliases
      debug:
        msg: "{{ item }}"
      loop: "{{ alias_list }}"
    - name: Set individual alias
      set_fact:
        alias_1: "{{ alias_list[0] }}"
        alias_2: "{{ alias_list[1] }}"
    - name: Use alias 1
      debug:
        msg: "First alias: {{ alias_1 }}"
    - name: Use alias 2
      debug:
        msg: "Second alias: {{ alias_2 }}"
    - name: Create plugin key database and stash file
      ansible.builtin.command: >
        keytool -exportcert
        -keystore /tmp/trust.p12
        -storetype PKCS12
        -storepass changeit
        -alias {{ alias_1 }}
        -file /tmp/trust1.crt
        -rfc
#      args:
#       chdir: /usr/lib/jvm/java-1.8.0-openjdk-1.8.0.462.b08-3.el9.x86_64/bin/
      register: trust1_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: trust1_result
    - name: Create plugin key database and stash file
      ansible.builtin.command: >
        keytool -exportcert
        -keystore /tmp/trust.p12
        -storetype PKCS12
        -storepass changeit
        -alias {{ alias_2 }}
        -file /tmp/trust2.crt
        -rfc
#      args:
#       chdir: /usr/lib/jvm/java-1.8.0-openjdk-1.8.0.462.b08-3.el9.x86_64/bin/
      register: trust2_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: trust2_result
  tags: [trust2_result1]

- name: Setting permissions for .crt files
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  tasks:
    - name: Ensure wlpadmin owns .crt and perms are 755
      ansible.builtin.find:
        paths: /tmp
        patterns: "*.crt"
      register: crt_files

    - name: Set permissions for found .crt files
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0755'
      loop: "{{ crt_files.files }}"
  tags: [applying_crt_perm]


- name: Running gskcapicmd
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  tasks:
    - name: Update plugin key database with key.crt
      ansible.builtin.command: >
        /opt/ibm/IHS/bin/gskcapicmd -cert -add
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -stashed
        -label key.crt
        -file /tmp/key.crt
        -format ascii
        -trust enable
      register: gskcapi_key_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: gskcapi_key_result
    - name: Update plugin key database with Trust1.crt
      ansible.builtin.command: >
        /opt/ibm/IHS/bin/gskcapicmd -cert -add
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -stashed
        -label trust1.crt
        -file /tmp/trust1.crt
        -format ascii
        -trust enable
      register: gskcapi_trust1_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: gskcapi_trust1_result
    - name: Update plugin key database with Trust2.crt
      ansible.builtin.command: >
        /opt/ibm/IHS/bin/gskcapicmd -cert -add
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -stashed
        -label trust2.crt
        -file /tmp/trust2.crt
        -format ascii
        -trust enable
      register: gskcapi_trust2_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: gskcapi_trust2_result
  tags: [gskcapi_result1]

