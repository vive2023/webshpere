---
- name: install chorus
  hosts: chorus_servers
  become: true
  become_user: wlpadmin
  gather_facts: yes
  roles:
    - role: chorus
      tags: [chorus]

- name: Install controller
  hosts: controller_servers
  become: true
  #vars_files:
  # - vars/main.yml
  become_user: wlpadmin
  gather_facts: yes
  roles:
    - role: controller
      tags: [controller]

- name: Install member
  hosts: member_servers
  become: true
  #vars_files:
  #- vars/main.yml
  become_user: wlpadmin
  gather_facts: yes
  roles:
    - role: member
      tags: [member]


- name: install IHS
  hosts: ihs_servers
  become_user: wlpadmin
  gather_facts: yes
  become: true
  roles:
    - role: ihs
      tags: [ihs]

- name: Integration of web and app server
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/controller/vars/main.yml
  tasks:
    - name: IHS Plugin Configuration
      ansible.builtin.lineinfile:
        path: "{{ server_xml_path }}"
        insertbefore: '</server>'
        line: <pluginConfiguration pluginInstallRoot="/opt/IBM/IHS/plugin/"/>
        state: present
  tags:
    - afterihs

- name: Integration of web and app
  hosts: member_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: IHS Plugin Configuration
      ansible.builtin.lineinfile:
        path: "{{ member_server_xml }}"
        insertbefore: '</server>'
        line: <pluginConfiguration pluginInstallRoot="/opt/IBM/IHS/plugin/"/>
        state: present
  tags:
    - afterihs1
- name: Stopping member server
  hosts: member_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Stop member
      ansible.builtin.shell: ssh wlpadmin@"{{ member_ip }}" "/opt/ibm/wlp/bin/server stop {{ server_name }};"
      delegate_to: localhost
      ignore_errors: yes
  tags: [stopping_member]


- name: Stopping controller
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/controller/vars/main.yml
  tasks:
    - name: Stop awd server
      ansible.builtin.shell: ssh wlpadmin@"{{ controller_ip }}" "/opt/ibm/wlp/bin/server stop {{ server_name }};"
      delegate_to: localhost
      ignore_errors: yes
  tags: [stopping_controller]

- name:  Starting controller
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/controller/vars/main.yml
  tasks:
    - name: Start controller
      ansible.builtin.shell: ssh wlpadmin@"{{ controller_ip }}" "/opt/ibm/wlp/bin/server start {{ server_name }};"
      delegate_to: localhost
      ignore_errors: yes
  tags: [starting_controller]


- name:  Starting member
  hosts: member_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Start member
      ansible.builtin.shell: ssh wlpadmin@"{{ member_ip }}" "/opt/ibm/wlp/bin/server start {{ server_name }};"
      delegate_to: localhost
      ignore_errors: yes
  tags: [starting_member]



- name: Controller--Plugin-cfg generation
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/controller/vars/main.yml
  tasks:
    - name: generate plgin-cfg file
      ansible.builtin.shell: ssh wlpadmin@"{{ controller_ip }}" "/opt/ibm/wlp/bin/pluginUtility generate --server="{{ server_name }}" --targetPath=/opt/ibm/wlp/usr/servers/"{{ server_name }}"/controller_plugin-cfg.xml;"
      delegate_to: localhost
      ignore_errors: yes
    - name: copy plgin-cfg file
      copy:
        src: "/opt/ibm/wlp/usr/servers/{{ server_name }}/controller_plugin-cfg.xml"
        dest: "/tmp"
        remote_src: yes
  tags: [plugin_generate_controller]


- name: Member--Plugin-cfg generation
  hosts: member_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: generate plgin-cfg file
      ansible.builtin.shell: ssh wlpadmin@"{{ member_ip }}" "/opt/ibm/wlp/bin/pluginUtility generate --server="{{ server_name }}" --targetPath=/opt/ibm/wlp/usr/servers/"{{ server_name }}"/member_plugin-cfg.xml;"
      delegate_to: localhost
      ignore_errors: yes
  tags: [plugin_generate_member]



- name: Member--Plugin-cfg copy to Controller
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file using scp from source to destination
      ansible.builtin.shell: |
        scp wlpadmin@{{ member_ip }}:/opt/ibm/wlp/usr/servers/{{ server_name }}/member_plugin-cfg.xml /tmp/
      args:
        executable: /bin/bash
  tags: [member_copy]


- name: Controller-Member plugin merging
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file using scp from source to destination
      ansible.builtin.shell: |
        /opt/ibm/wlp/bin/pluginUtility merge --sourcePath=/tmp/controller_plugin-cfg.xml,/tmp/member_plugin-cfg.xml --targetPath=/opt/ibm/wlp/bin
      args:
        executable: /bin/bash
  tags: [merging]


- name: Rename merged plugin to plugin-cfg.yml
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file using scp from source to destination
      ansible.builtin.shell: |
        cp /opt/ibm/wlp/bin/merged-plugin-cfg.xml /opt/ibm/wlp/bin/plugin-cfg.xml
      args:
        executable: /bin/bash
  tags: [renaming]

- name: Adding httpsession to plugin-cfg.yml
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Adding affinity http sesion
      community.general.xml:
        path: "/opt/ibm/wlp/bin/plugin-cfg.xml"
        xpath: /Config
        attribute: AffinityOn
        value: "true"
        state: present
  tags: [addinghttpsession]


- name: Rename merged plugin to plugin-cfg.yml
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file from controller to bastion
      fetch:
        src: "/opt/ibm/wlp/bin/plugin-cfg.xml"
        dest: "/tmp/"
        flat: yes
  tags: [copyto_bastion]


- name: Copy plugin from bastion to webserver1
  hosts: ihs_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file from bastion to web1
      copy:
        src: "/tmp/plugin-cfg.xml"
        dest: "/opt/ibm/IHS/plugin/config/webserver1/"
        mode: 0755
  tags: [bastionto_ihs]


- name: Rename merged plugin to plugin-cfg.yml
  hosts: ihs_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Delete Webprofile-8.0 block from server.xml
      ansible.builtin.xml:
        path: "/opt/ibm/IHS/plugin/config/webserver1/plugin-cfg.xml"
        xpath: "/Config/VirtualHostGroup[@Name='default_host_1_1']/VirtualHost[@Name='{{ item }}']"
        state: present
        pretty_print: yes
      loop:
        - "*:20001"
        - "*:10001"
  tags: [adding_entry1]


- name: Rename merged plugin to plugin-cfg.yml
  hosts: ihs_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Delete Webprofile-8.0 block from server.xml
      ansible.builtin.xml:
        path: "/opt/ibm/IHS/plugin/config/webserver1/plugin-cfg.xml"
        xpath: "/Config/VirtualHostGroup[@Name='/cell/sharedCell_2/vHostGroup/shared_host_0']/VirtualHost[@Name='{{ item }}']"
        state: present
        pretty_print: yes
      loop:
        - "*:20001"
        - "*:10001"
  tags: [adding_entry2]

- name: Rename merged plugin to plugin-cfg.yml
  hosts: ihs_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Insert LoadModule and WebSpherePluginConfig inside <IfFile>
      ansible.builtin.lineinfile:
        path: /opt/ibm/IHS/conf/httpd.conf
        line: "{{ item }}"
        insertafter: "^<IfFile.*/plugin-cfg.xml>"
        state: present
      loop:
        - "  LoadModule was_ap24_module plugin/bin/mod_was_ap24_http.so"
        - "  WebSpherePluginConfig /opt/ibm/IHS/plugin/config/webserver1/plugin-cfg.xml"
  tags: [load_module]


- name: Install glibc and pcre on RHEL
  hosts: ihs_servers
  become: true
  tasks:
    - name: Ensure required packages are installed
      ansible.builtin.yum:
        name:
          - glibc
          - pcre
        state: present
  tags: [pkginstall]

- name: Validate XML file using xmllint
  hosts: ihs_servers
  tasks:
    - name: Check if XML file is well-formed
      command: xmllint --noout /opt/ibm/IHS/plugin/config/webserver1/plugin-cfg.xml
      register: xmllint_result
      ignore_errors: yes

    - name: Fail if XML is invalid
      fail:
        msg: "The XML file is not valid!"
      when: xmllint_result.rc != 0
  tags: [xml_lint]

  - name: Generate plugin key database and stash file
  hosts: ihs_servers
  become: yes
  tasks:
    - name: Create plugin key database and stash file
      ansible.builtin.command: >
        ./gskcapicmd -keydb -create
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -pw changeit
        -type cms
        -stash
      args:
        chdir: /opt/ibm/IHS/bin/
      register: keydb_result
      changed_when: "'already exists' not in keydb_result.stderr"
    - name: Show command output
      ansible.builtin.debug:
        var: keydb_result
  tags: [keydb_gen]

- name: Fix permissions in plugin webserver directory
  hosts: ihs_servers
  become: yes
  tasks:
    - name: Set ownership and permissions recursively
      ansible.builtin.file:
        path: /opt/ibm/IHS/plugin/config/webserver1
        owner: wlpadmin
        group: enduser
        mode: "0755"
        recurse: yes
  tags: [permissions]

- name: Copy from Controller to bastion
  hosts: controller_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file1 from controller to bastion
      fetch:
        src: "{{ item }}"
        dest: "/tmp/"
        flat: yes
      loop:
        - /opt/ibm/wlp/usr/servers/awdserver/resources/security/key.p12
        - /opt/ibm/wlp/usr/servers/awdserver/resources/security/trust.p12
  tags: [copykey_bastion]

- name: Copy plugin from bastion to webserver1
  hosts: ihs_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file from bastion to web1
      copy:
        src: "{{ item }}"
        dest: "/tmp/"
        mode: 0755
      loop:
        - /tmp/key.p12
        - /tmp/trust.p12
  tags: [keyto_ihs]

- name: Copy from member to bastion
  hosts: member_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file1 from controller to bastion
      fetch:
        src: "{{ item.src }}"
        dest: "/tmp/{{ item.dest }}"
        flat: yes
      loop:
        - { src: "/opt/ibm/wlp/usr/servers/{{ server_name }}/resources/security/key.p12" ,dest: "mem_key.p12" }
        - { src: "/opt/ibm/wlp/usr/servers/{{ server_name }}/resources/security/trust.p12" ,dest: "mem_trust.p12"}
  tags: [copymemberkey_bastion]

- name: Copy plugin from bastion to webserver1
  hosts: ihs_servers
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file from bastion to web1
      copy:
        src: "{{ item }}"
        dest: "/tmp/"
        mode: 0755
      loop:
        - /tmp/mem_key.p12
        - /tmp/mem_trust.p12
  tags: [memberkeyto_ihs]

- name: Capturing aliasname of Key.p12
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  tasks:
    - name: Create plugin key database and stash file
      ansible.builtin.shell: |
        keytool -list -keystore /tmp/key.p12 -storetype PKCS12 -storepass changeit -file liberty_key.crt -rfc|grep -i alias|awk '{print $3}'
      register: key_p12_alias_names
      changed_when: false
    - name: Set alias list variable
      set_fact:
        alias_list: "{{ key_p12_alias_names.stdout_lines }}"
    - name: Print aliases
      debug:
        msg: "{{ item }}"
      loop: "{{ alias_list }}"
    - name: Set individual alias
      set_fact:
        alias_key1_p12: "{{ alias_list[0] }}"
    - name: Use alias 1
      debug:
        msg: "First alias: {{ alias_key1_p12 }}"
    - name: Create plugin key database and stash file
      ansible.builtin.command: >
        keytool -exportcert
        -keystore /tmp/key.p12
        -storetype PKCS12
        -storepass changeit
        -alias {{ alias_key1_p12 }}
        -file /tmp/key.crt
        -rfc
      register: key_p12_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: key_p12_result
  tags: [key_p12_results]

