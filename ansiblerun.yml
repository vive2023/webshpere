- name: Restarting httpd service in IHS servers final
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/ihs/vars/main.yml
  tasks:
  - name: Kill old httpd process
    ansible.builtin.shell: "pgrep -f 'httpd'| xargs -r kill -9"
    ignore_errors: yes

  - name: Stop IHS server
    ansible.builtin.command: "./apachectl stop"
    args:
      chdir: "/opt/ibm/IHS/bin"
    ignore_errors: yes

  - name: Start IHS server
    ansible.builtin.command: "./apachectl start"
    args:
      chdir: "/opt/ibm/IHS/bin"
    ignore_errors: yes

  - name: Status IHS server
    ansible.builtin.shell: "ps -ef|grep -i httpd"
    register: httpd_process
  tags: [ihs_restart_final]

