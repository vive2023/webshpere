      register: trust1_mem_alias_names
      changed_when: false
    - name: Set alias list variable
      set_fact:
        mem_alias_list: "{{ trust1_mem_alias_names.stdout_lines }}"
    - name: Print aliases
      debug:
        msg: "{{ item }}"
      loop: "{{ mem_alias_list }}"
    - name: Set individual alias
      set_fact:
        trust1_mem_alias_list: "{{ mem_alias_list[0] }}"
        trust2_mem_alias_list: "{{ mem_alias_list[1] }}"
    - name: Use alias 1
      debug:
        msg: "First alias: {{ trust1_mem_alias_list }}"
    - name: Use alias 2
      debug:
        msg: "Second alias: {{ trust2_mem_alias_list }}"
    - name: Create plugin key database and stash file
      ansible.builtin.command: >
        keytool -exportcert
        -keystore /tmp/mem_trust.p12
        -storetype PKCS12
        -storepass changeit
        -alias {{ trust1_mem_alias_list }}
        -file /tmp/mem_trust1.crt
        -rfc
#      args:
#       chdir: /usr/lib/jvm/java-1.8.0-openjdk-1.8.0.462.b08-3.el9.x86_64/bin/
      register: trust1_mem_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: trust1_mem_result
    - name: Create plugin key database and stash file
      ansible.builtin.command: >
        keytool -exportcert
        -keystore /tmp/mem_trust.p12
        -storetype PKCS12
        -storepass changeit
        -alias {{ trust2_mem_alias_list }}
        -file /tmp/mem_trust2.crt
        -rfc
#      args:
#       chdir: /usr/lib/jvm/java-1.8.0-openjdk-1.8.0.462.b08-3.el9.x86_64/bin/
      register: trust2_mem_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: trust2_mem_result
  tags: [trust2_mem_result1]


- name: Setting permissions for .crt files
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  tasks:
    - name: Ensure wlpadmin owns .crt and perms are 755
      ansible.builtin.find:
        paths: /tmp
        patterns: "*.crt"
      register: mem_crt_files

    - name: Set permissions for found .crt files
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0755'
      loop: "{{ mem_crt_files.files }}"
  tags: [applying_mem_crt_perm]

- name: Running gskcapicmd
  hosts: ihs_servers
  become: yes
  become_user: wlpadmin
  tasks:
    - name: Update plugin key database with key.crt
      ansible.builtin.command: >
        /opt/ibm/IHS/bin/gskcapicmd -cert -add
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -stashed
        -label mem_key.crt
        -file /tmp/mem_key.crt
        -format ascii
        -trust enable
      register: gskcapi_mem_key_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: gskcapi_mem_key_result
    - name: Update plugin key database with Trust1.crt
      ansible.builtin.command: >
        /opt/ibm/IHS/bin/gskcapicmd -cert -add
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -stashed
        -label mem_trust1.crt
        -file /tmp/mem_trust1.crt
        -format ascii
        -trust enable
      register: gskcapi_mem_trust1_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: gskcapi_mem_trust1_result
    - name: Update plugin key database with Trust2.crt
      ansible.builtin.command: >
        /opt/ibm/IHS/bin/gskcapicmd -cert -add
        -db /opt/ibm/IHS/plugin/config/webserver1/plugin-key.kdb
        -stashed
        -label mem_trust2.crt
        -file /tmp/mem_trust2.crt
        -format ascii
        -trust enable
      register: gskcapi_mem_trust2_result
      changed_when: false
    - name: Show command output
      ansible.builtin.debug:
        var: gskcapi_mem_trust2_result
  tags: [gskcapi_mem_result11]

- name: Rename merged plugin to plugin-cfg.yml
  hosts: all
  gather_facts: yes
  become: true
  become_user: wlpadmin
  vars_files:
    - /home/wlpadmin/roles/member/vars/main.yml
  tasks:
    - name: Copy file from controller to bastion
      fetch:
        src: "/opt/chorus/webserver.zip"
        dest: "/tmp/"
        flat: yes
      when: ansible_host == hostvars[groups['controller_servers'][0]]['ansible_host']

    - name: Copy file from bastion to web1
      copy:
        src: "/tmp/webserver.zip"
        dest: "/opt/ibm/IHS/htdocs/"
        mode: 0755
